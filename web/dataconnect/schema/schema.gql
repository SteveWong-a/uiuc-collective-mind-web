type User @table(key: "uid") {
  uid: String! @default(expr: "auth.uid")
  email: String! @unique
  courseConfigs: String
  canvasToken: String
  prairieLearnToken: String
}

type Course @table(key: "name") {
  name: String!
}

type Enrollment @table(key: ["user", "course"]) {
  user: User!
  course: Course!
}

# Per-user rows: the same Canvas/PL externalId can exist once per student.
# Title, due date, and URL are not a shared global catalog.
type Assignment @table(key: ["user", "externalId"]) {
  user: User!
  externalId: String!
  course: Course!
  title: String!
  dueDate: Timestamp
  url: String
  source: String
}

type UserAssignment @table(key: ["user", "assignment"]) {
  user: User!
  assignment: Assignment!
  score: String
  status: String
}
